name: E2E Tests

on:
  pull_request:
    branches:
      - '**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

    - name: Set up Java 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.28"

    - name: Cache Gradle dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Python dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('server/e2e_tests_py/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install Python dependencies
      run: |
        cd server/e2e_tests_py
        uv venv
        source .venv/bin/activate
        uv pip install -e '.[dev]'

    # Warm the build so the first test does not time out waiting on compilation
    # (the suite starts the server itself with `./gradlew run`). shadowJar stays
    # off the `check` lifecycle, so it skips ktlint — covered by server_linter —
    # and koverVerify, which would verify an empty artifact here and fail at 0%.
    - name: Build server
      run: |
        cd server
        ./gradlew :app:shadowJar

    - name: Run ruff checks (format & lint)
      run: |
        cd server/e2e_tests_py
        source .venv/bin/activate
        ruff format --check . && ruff check .

    - name: Run E2E tests
      run: |
        cd server/e2e_tests_py
        source .venv/bin/activate
        pytest tests/ -v --tb=short
