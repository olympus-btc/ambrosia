version: 2

updates:
  - package-ecosystem: npm
    directory: /client
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(client)"
    groups:
      client-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /electron
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(electron)"
    groups:
      electron-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /server
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(server)"
    groups:
      server-minor-and-patch:
        update-types:
          - minor
          - patch

  # e2e_tests_py uses uv (pyproject.toml + uv.lock), not pip/requirements.txt.
  - package-ecosystem: uv
    directory: /server/e2e_tests_py
    target-branch: development
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(e2e)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
