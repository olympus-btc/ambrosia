x-container-hardening: &container-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-logging: &container-log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  phoenixd:
    <<: *container-hardening
    image: acinq/phoenixd:0.9.1
    container_name: phoenixd
    restart: unless-stopped
    logging: *container-log-rotation
    networks:
      - default
    volumes:
      - phoenixd_datadir:/phoenix/.phoenix

  ambrosia:
    <<: *container-hardening
    build: server/
    image: ambrosia
    container_name: ambrosia
    restart: unless-stopped
    logging: *container-log-rotation
    networks:
      - default
    volumes:
      - ambrosia_datadir:/home/ambrosia/.Ambrosia-POS
      - phoenixd_datadir:/home/ambrosia/.phoenix
    depends_on:
      - phoenixd
    user: "ambrosia:ambrosia"
    read_only: true
    tmpfs:
      - /tmp:exec,size=100m
  ambrosia-client:
    <<: *container-hardening
    build:
      context: client/
      args:
        NEXT_PUBLIC_PORT_API: "9154"
    image: ambrosia-client
    container_name: ambrosia-client
    restart: unless-stopped
    logging: *container-log-rotation
    networks:
      - default
    depends_on:
      - ambrosia
    environment:
      NEXT_PUBLIC_API_URL: http://ambrosia:9154
      NEXT_PUBLIC_PORT_API: "9154"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    user: "node:node"
    read_only: true
    tmpfs:
      - /tmp:exec,size=100m

  caddy:
    build: docker/caddy/
    image: ambrosia-caddy
    container_name: caddy
    restart: unless-stopped
    logging: *container-log-rotation
    networks:
      - default
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_datadir:/data
    depends_on:
      - ambrosia
      - ambrosia-client
    security_opt:
      - no-new-privileges:true

volumes:
  phoenixd_datadir:
  ambrosia_datadir:
  caddy_datadir:
